[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcodarr-core"
version = "1.2.0"
description = "Core library for Transcodarr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=1.10,<2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
# your code is under "srt/", not "src/"
package-dir = {"" = "srt"}

[tool.setuptools.packages.find]
where = ["srt"]
include = ["transcodarr_core*"]